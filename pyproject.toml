[build-system]
build-backend = "hatchling.build"
requires = [
  "hatch-pinned-extra==0.4",
  "hatch-vcs",
  "hatchling",
]

[project]
name = "tap-pypistats"
description = "Singer tap for pypistats.org"
readme = "README.md"
keywords = [
  "meltano",
  "pypistats",
  "singer-io",
  "singer-tap",
]
license = "Apache-2.0"
license-files = [ "LICENSE" ]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dynamic = [
  "optional-dependencies",
  "version",
]
dependencies = [
  "requests~=2.32",
  "requests-cache~=1.2",
]
[project.scripts]
tap-pypistats = "tap_pypistats.tap:main"
[project.urls]
Documentation = "https://github.com/edgarrmondragon/tap-pypistats#readme"
Homepage = "https://github.com/edgarrmondragon/tap-pypistats"

[dependency-groups]
dev = [
  { include-group = "tests" },
]
tests = [
  "pytest>=9",
  "pytest-httpserver>=1.1",
]

[tool.hatch.metadata.hooks.pinned_extra]
lockfile = "pylock.toml"
name = "pinned"
[tool.hatch.version]
source = "vcs"

[tool.uv]
required-version = ">=0.6"
prerelease = "allow"
preview = true

[tool.ruff]
line-length = 100
preview = true
[tool.ruff.lint]
select = [
  "ANN",
  "ARG",
  "B",
  "BLE",
  "C4",
  "C90",
  "DTZ",
  "E",
  "EM",
  "EXE",
  "F",
  "FA",
  "FLY",
  "FURB",
  "G",
  "I",
  "ICN",
  "ISC",
  "LOG",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLOT",
  "T10",
  "T20",
  "TC",
  "TRY",
  "UP",
  "W",
  "YTT",
]
per-file-ignores."tests/*" = [
  "assert",
]

[tool.pyproject-fmt]
max_supported_python = "3.15"
table_format = "long"

[tool.tox]
requires = [ "tox>=4.55", "tox-uv>=1.35" ]
env_list = [
  { prefix = "3.", start = 11 },
]
[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
description = "run unit tests on Python {py_dot_ver}"
dependency_groups = [ "tests" ]
pass_env = [ "TAP_PYPISTATS_*" ]
commands = [ [ "pytest", { replace = "posargs", default = [ "tests" ], extend = true } ] ]
