ci:
  autofix_commit_msg: "chore: pre-commit autofix"
  autofix_prs: true
  autoupdate_branch: main
  autoupdate_commit_msg: "chore: pre-commit autoupdate"
  autoupdate_schedule: "monthly"
  skip:
    - uv-lock

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
        args: [--fix, --show-fixes]
      - id: ruff-format

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.25.1
    hooks:
      - id: pyproject-fmt

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.17
    hooks:
      - id: uv-lock
      - id: uv-sync
      - id: uv-export
        args: ["--frozen", "--format=pylock.toml", "--output-file=pylock.toml", "--no-dev", "--quiet"]

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.3
    hooks:
      - id: check-github-workflows
      - id: check-meltano
      - id: check-renovate
        language: python
        additional_dependencies:
        - pyjson5==2.0.1

  - repo: https://github.com/henryiii/flake8-lazy
    rev: v0.8.3
    hooks:
      - id: flake8-lazy
        args: ["--apply=set"]
        files: '^tap_pypistats'
